<div class="wrapper-paragraph">
    <img class="hello" src="/assets/images/pop-img.png" alt="hi">
    <h2>registration</h2>
</div>

<div class="block-form">
    <form id="registration-form">

        <div class="wrapper-form-group">
            <div class="form-group">
                <label for="login"><span>&#42;</span>Login</label>
                <input type="text" id="login" name="login" placeholder="Enter your login" required>
                <small class="incorrect-data">Required field</small>
            </div>

            <div class="form-group">
                <label for="name"><span>&#42;</span>Name</label>
                <input type="text" id="name" name="name" placeholder="Enter your name" required>
                <small class="incorrect-data">Required field</small>
            </div>

        </div>

        <div class="form-group">
            <label for="email"><span>&#42;</span>Email Address </label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            <small class="incorrect-data">Required field</small>
        </div>

        <div class="wrapper-form-group">
            <div class="form-group">
                <label for="password"><span>&#42;</span>Password</label>
                <input type="password" id="password" name="password" placeholder="Enter your password" required>
                <small class="incorrect-data">Required field</small>
            </div>

            <div class="form-group">
                <label for="confirmPassword"><span>&#42;</span>Confirm password</label>
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm your password"
                    required>
                <small class="incorrect-data">Required field</small>
            </div>
        </div>

<!-- 
        <button type="submit" id="btnSubmit" class="orange-btn" disabled>Register<img
                src="/assets/icons/arrow-right.png" alt="arrow icon" class="arrow">
        </button> -->
        <app-button variant="green" [disabled]="true">Register</app-button>

    </form>
</div>
