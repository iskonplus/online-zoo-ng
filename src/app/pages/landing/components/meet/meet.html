<section id="meet">
    <div class="container meet">
        <h2>meet some our Pets </h2>
        <p>Do you have a special place in your heart for animals? Who are your favorites? Perhaps you'd like to
            donate to special ones or all our pets? We think it's important for you to choose how your donation is
            used. </p>

        <div class="wrapper-slider-arrows">
            <app-button variant="slider-outline-blue" class="left" [disabled]="true"></app-button>
            <app-button variant="slider-outline-blue" class="right" [disabled]="true"></app-button>
        </div>

        <div class="wrapper-slider">
            <div class="slider__viewport">
                <ul class="slider__track">
                    <span class="loader meet"></span>
                </ul>
            </div>
        </div>
        <app-button variant="outline-blue">choose your favourite</app-button>
    </div>
</section>
