<div class="wrapper-zoos-section">
    <div class="out-slider">


        @if(sideBarState$ | async; as state){


        <div class="wrapper-side-bar">
            <div class="header-side-bar">
                <div class="wrapper-cam">
                    <h4>Live</h4>
                    <img src="/assets/icons/cam.png" alt="icon cam">
                </div>
                <button class="site-bar-btn">
                    <span class="btn-content">&#8249;&#8249;</span>
                </button>
            </div>
            <div class="side-bar-viewport">
                <div class="track-side-bar">

                    @if(state.loading){
                    <mat-spinner></mat-spinner>
                    }

                    @if(state.error){
                    <p class="error-response">{{ state.error }}</p>
                    }

                    @if(state.data; as response){
                    @for(pet of response.data; track pet.id ){

                    <div class="side-bar-slide"
                    [class.active]="pet.petId  === 1 ? true : false"
                    [attr.data-pet-id]="pet.petId">
                        <div class="side-bar-icon-container">
                            <span class="wrapper-icon">
                                <img [src]="getIconById(pet.petId)" alt="animal icon">
                            </span>
                        </div>

                        <div class="side-bar-content">
                            <p>{{pet.text}}</p>
                        </div>
                    </div>
                    }
                    }
                </div>
            </div>
            <div class="footer-side-bar">
                <button class="site-bar-btn">
                    <span class="btn-content">&#8249;</span>
                </button>
            </div>
        </div>
        }

    </div>
    <section id="zoos">
        <div class="container zoos">
            <div class="wrapper-video">
                <h2 class="title-animal">live cams</h2>
                <iframe class="main-video" width="100%" height="auto" src="" allowfullscreen>
                </iframe>
                <app-button variant="orange" class="orange-btn">donate now</app-button>
            </div>

            <div class="wrapper-slider">
                <h3 class="title-slider">more live views </h3>
                <div class="slider__viewport">

                    <ul class="slider__track">

                        <li class="slider__slide active">
                            <figure>
                                <div class="wrapper-cam">
                                    <h4>cam1</h4>
                                    <img src="/assets/icons/cam.png" alt="icon cam">
                                </div>
                                <img src="" class="video-preview" alt="photo animal">
                                <img src="/assets/icons/play-button.png" alt="logo you-tube" class="yt-play-btn">
                            </figure>

                        </li>

                        <li class="slider__slide">
                            <figure>

                                <div class="wrapper-cam">
                                    <h4>cam2</h4>
                                    <img src="/assets/icons/cam.png" alt="icon cam">
                                </div>
                                <img src="" class="video-preview" alt="photo animal">
                                <img src="/assets/icons/play-button.png" alt="logo you-tube" class="yt-play-btn">
                            </figure>

                        </li>

                        <li class="slider__slide">
                            <figure>
                                <div class="wrapper-cam">
                                    <h4>cam3</h4>
                                    <img src="/assets/icons/cam.png" alt="icon cam">
                                </div>
                                <img src="" class="video-preview" alt="photo animal">
                                <img src="/assets/icons/play-button.png" alt="logo you-tube" class="yt-play-btn">
                            </figure>

                        </li>
                        <li class="slider__slide">
                            <figure>
                                <div class="wrapper-cam">
                                    <h4>cam4</h4>
                                    <img src="/assets/icons/cam.png" alt="icon cam">
                                </div>
                                <img src="" class="video-preview" alt="photo animal">
                                <img src="/assets/icons/play-button.png" alt="logo you-tube" class="yt-play-btn">
                            </figure>
                        </li>
                    </ul>

                    <div class="wrapper-slider-arrows">
                        <app-button variant="slider-outline-blue" class="left"></app-button>
                        <app-button variant="slider-outline-blue" class="right"></app-button>
                    </div>

                </div>
            </div>
        </div>
    </section>

    <app-your-donation></app-your-donation>

</div>

<section id="did-you-now">
    <div class="wrapper-loader">
        <span class="loader did-you-now"></span>
    </div>
    <div class="wrapper-did-you-now"></div>

</section>
